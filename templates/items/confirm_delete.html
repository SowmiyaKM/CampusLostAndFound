{% extends "base.html" %}
{% block title %}Delete Report — CampusConnect{% endblock %}
{% block content %}
<section class="section">
  <div class="container text-center" style="max-width:520px;">
    <div class="card" style="padding:40px;">
      <div style="font-size:3rem; margin-bottom:14px;">🗑️</div>
      <h2>Delete this report?</h2>
      <p>You're about to permanently delete <strong>"{{ item.title }}"</strong>. This action cannot be undone.</p>
      <form method="post">
        {% csrf_token %}
        <div class="flex gap-2" style="justify-content:center; margin-top:20px;">
          <button type="submit" class="btn btn-danger">Yes, Delete It</button>
          <a href="{{ item.get_absolute_url }}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
