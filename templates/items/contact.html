{% extends "base.html" %}
{% block title %}Contact — CampusConnect{% endblock %}
{% block content %}
<section class="section" style="padding-top:60px;">
  <div class="container" style="max-width:640px;">
    <div class="text-center" style="margin-bottom:32px;">
      <span class="eyebrow">Get in touch</span>
      <h1>We'd love to hear from you</h1>
      <p>Questions, feedback, or found a bug? Send us a message and the CampusConnect team will get back to you.</p>
    </div>
    <div class="card form-card">
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@college.edu" required>
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" class="form-input" placeholder="How can we help?" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" class="form-input" rows="5" placeholder="Tell us more..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Message</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
